header:
  version: 14
  includes:
    - kas/base.yml
    - kas/openembedded.yml
    - kas/app-dev.yml

machine: p3768-0000-p3767-0000
target:
  - demo-image-base
distro: tegrademo

repos:
  meta-tegra:
    path: repos/meta-tegra
    url: https://github.com/OE4T/meta-tegra.git
  tegra-demo-distro:
    path: repos/tegra-demo-distro
    url: https://github.com/OE4T/tegra-demo-distro.git
    layers:
      layers/meta-tegrademo:

local_conf_header:
  tegra: |
    IMAGE_INSTALL:append = " i2c-tools opensc networkmanager qwerty"
    USE_REDUNDANT_FLASH_LAYOUT = "1"
    CORE_IMAGE_EXTRA_INSTALL:append = " packagegroup-base"

    INHERIT:remove = "tegra-support-sanity distro_layer_buildinfo"
    EXTRA_IMAGE_FEATURES ?= "allow-empty-password empty-root-password allow-root-login"
    PARALLEL_MAKE = "-j 8"
    BB_NUMBER_THREADS = "8"